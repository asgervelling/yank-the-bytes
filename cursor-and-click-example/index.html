<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command AST + Interpreter — Minimal Example</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12141c;
      --panel: #1b1f2b;
      --accent: #5fd0ff;
      --text: #e7ebf3;
      --muted: #8891a7;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      box-sizing: border-box;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }
    p.hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }
    .controls {
      display: flex;
      gap: 12px;
    }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid #2a2f3f;
      border-radius: 8px;
      padding: 8px 24px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover {
      border-color: var(--accent);
    }
    button.active {
      border-color: var(--accent);
      color: var(--accent);
    }
    .output {
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <h1>Command AST + Interpreter — Minimal Example</h1>
  <p class="hint">Same pattern as the bouncing-ball demo, stripped down: no animation, just a timer and two buttons.</p>
  <div class="controls">
    <button id="button-a" type="button">A</button>
    <button id="button-b" type="button">B</button>
  </div>
  <div id="click-output" class="output">Clicked: (none yet)</div>
  <div id="cursor-output" class="output">Cursor: (waiting for first second...)</div>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
