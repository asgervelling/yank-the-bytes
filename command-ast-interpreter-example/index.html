<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command AST + Interpreter Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12141c;
      --panel: #1b1f2b;
      --accent: #5fd0ff;
      --text: #e7ebf3;
      --muted: #8891a7;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      box-sizing: border-box;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }
    p.hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }
    #container {
      position: relative;
      width: min(600px, 90vw);
      height: 400px;
      background: var(--panel);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a2f3f;
    }
    #ball {
      position: absolute;
      top: 0;
      left: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent);
      will-change: transform;
      transition: background-color 120ms ease;
    }
    #ball.flash {
      background: #ff9e5f;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid #2a2f3f;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover {
      border-color: var(--accent);
    }
    #status {
      font-size: 0.9rem;
      color: var(--accent);
    }
    #status.paused {
      color: var(--muted);
    }
    #score {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <h1>Command AST + Interpreter</h1>
  <p class="hint">Arrow keys nudge velocity. Pure engine computes state; interpreter executes the resulting Command AST.</p>
  <div id="container">
    <div id="ball"></div>
  </div>
  <div class="controls">
    <button id="toggle-btn" type="button">Pause</button>
    <button id="reset-btn" type="button">Reset</button>
    <span id="score">Bounces: 0</span>
    <span id="status">Running</span>
  </div>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
